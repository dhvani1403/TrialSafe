name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: trialmatch
          POSTGRES_PASSWORD: trialmatch
          POSTGRES_DB: trialmatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trialmatch" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://trialmatch:trialmatch@localhost:5432/trialmatch
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app scripts
      - name: Smoke ingest (2 conditions x 15 trials) and rule parse
        run: |
          python -m scripts.cli ingest --conditions "breast cancer" "type 2 diabetes" --per-condition 15
          python -m scripts.cli parse-rules
          python -m scripts.cli embed
      - name: Tests
        run: python -m pytest -q
      - name: Parsing accuracy (rules) on gold set
        run: python -m scripts.cli eval-parsing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t trialmatch-api ./backend
      - run: docker build -t trialmatch-web ./frontend
